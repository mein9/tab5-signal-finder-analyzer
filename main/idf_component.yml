dependencies:
  idf:
    version: ">=5.5"
  # Must match the ESP-Hosted firmware already on this Tab5's C6 (3.0.6).
  espressif/esp_hosted:
    version: "==3.0.6"
  # 0.3.0+ knows the Tab5's newer ST7121 display panel.
  m5stack/m5unified:
    version: ">=0.3.0"
  m5stack/m5gfx:
    version: ">=0.3.0"
  # Lets the normal esp_wifi API run on the C6 over the ESP-Hosted link.
  espressif/esp_wifi_remote:
    version: ">=1.3.1"
